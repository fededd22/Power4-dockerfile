version: '3.8'

services:
  ooredoo-bot:
    build: .
    container_name: ooredoo-bot
    restart: unless-stopped
    environment:
      - TZ=Africa/Algiers
    volumes:
      # حفظ البيانات بشكل دائم
      - ./data:/app/data
    # حد الموارد (اختياري)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
